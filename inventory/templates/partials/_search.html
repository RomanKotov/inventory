{% load i18n %}
<div class="accordion position-sticky top-0 mb-3 mt-1" id="searchAccordion">
  <div class="accordion-item">
    <h2 class="accordion-header" id="searchMenu">
      <button
        class="accordion-button bg-body-secondary"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#collapseMenu"
        aria-expanded="false"
        aria-controls="collapseMenu"
      >
        <span class="mw-50 text-truncate">{% translate 'Search' %}</span>
      </button>
    </h2>
    <div
      id="collapseMenu"
      class="accordion-collapse collapse"
      aria-labelledby="searchMenu"
      data-bs-parent="#searchAccordion"
    >
      <div class="accordion-body">
        <div class="container-fluid">
          <form
            class="ms-auto d-flex flex-column"
            hx-get=""
            hx-trigger="change, input changed delay:200ms from: input"
            hx-target="#table-results"
          >
            <input
              class="form-control mb-3"
              type="search"
              name="search"
              placeholder="{% translate 'Search' %}"
              aria-label="{% translate 'Search' %}"
              value="{{search}}"
            >
            <section class="d-flex flex-wrap">
            {% for tag in tags %}
              <div class="form-check mw-25 me-5 me-md-auto">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="tag"
                  value="{{tag.id}}"
                  id="tag-{{tag.id}}"
                  {% if tag.id|stringformat:"i" in selected_tags %}checked{% endif %}
                >
                <label class="form-check-label" for="tag-{{tag.id}}">
                  <span class="badge text-bg-{{tag.type}}">{{tag}}</span>
                </label>
              </div>
            {% endfor %}
            </section>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
