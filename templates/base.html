{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{% static 'images/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <title>{% block title %}Inventory App{% endblock %}</title>
  <script src="{% static 'js/theme.js' %}"></script>
  {% bootstrap_css %}
  {% htmx_script version=4 %}
</head>
<body
  hx-boost:inherited="true"
  class="container container-fluid"
  hx-headers:inherited='{"x-csrftoken": "{{ csrf_token }}"}'
  hx-indicator:inherited="#global-loader"
>
  {% block navigation %}
    {% include "partials/_navbar.html" %}
  {% endblock %}
  {% bootstrap_messages %}
  {% block content %}{% endblock %}
  {% bootstrap_javascript %}
  <div id="global-loader" class="spinner-border" role="status"></div>
</body>
</html>
