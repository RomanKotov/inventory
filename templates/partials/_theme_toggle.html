{% load i18n %}
<button class="theme-toggle">
  <span class="theme-hide theme-label-when-auto">💻{% translate 'Toggle theme (current theme: auto)' %}</span>
  <span class="theme-hide theme-label-when-light">🌅{% translate 'Toggle theme (current theme: light)' %}</span>
  <span class="theme-hide theme-label-when-dark">🌒{% translate 'Toggle theme (current theme: dark)' %}</span>
</button>
