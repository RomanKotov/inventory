{% extends 'base.html' %}

{% block title %}{% if form.errors %}{% translate "Error:" %} {% endif %}{{ block.super }}{% endblock %}
{% block content %}
<h2>{% translate 'Change password' %}</h2>
  <form method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <input type="submit" value="{% translate 'Change my password' %}" class="btn btn-success">
  </form>
{% endblock %}
